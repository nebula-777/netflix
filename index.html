<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #141414;
            background-image: url("back.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Optional: Add dark overlay for better text visibility */
            background-color: #141414;
            cursor:cell;
        }
        /* Dark overlay - THIS CREATES THE DIM EFFECT */
       body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);  /* Dim only the background */
            z-index: -1;  /* Puts overlay BEHIND content */
        }

        /* Center the logo at top */
        .logo {
            text-align: center;
            padding: 20px 0;
        }

        /* Image logo style */
        .logo img {
            width: 300px;  /* Adjust width as needed */
            height: auto;
            display: inline-block;
        }

.login-box {
    background: rgba(0, 0, 0, 0.75);
    width: 350px;
    margin: 50px auto;
    padding: 40px;
    border-radius: 8px;
    position: relative;
    box-sizing: border-box;  /* ← ADD THIS LINE */
}

        .login-box h2 {
            color: white;
            margin-bottom: 20px;
        }

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    background: #333;
    border: none;
    border-radius: 4px;
    color: white;
    font-size: 14px;
    box-sizing: border-box;  /* ← ADD THIS LINE */
}

button {
    width: 100%;        /* Make sure this is 100% */
    padding: 12px;
    background: #E50914;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    box-sizing: border-box;  /* ← ADD THIS LINE */
}

        button:hover {
            background: #f40612;
        }

        .signup {
            color: #737373;
            text-align: center;
            margin-top: 20px;
        }

        .signup a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- REPLACE THE IMAGE URL BELOW WITH YOUR OWN IMAGE PATH -->
    <div class="logo">
        <img src="net.jpg" alt="Netflix">
    </div>

    <div class="login-box">
        <h2>Sign In</h2>
        <form>
            <input type="email" placeholder="Email or phone number" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <div class="signup">
            New to Netflix? <a href="#">Sign up now.</a>
        </div>
    </div>

</body>
</html>
